version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: flyyy-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flyyy_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flyyy-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flyyy-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flyyy_ai
      PROMPT_MONITORING_ENABLED: "true"
      RETENTION_DAYS: 30
      AI_PROVIDER: demo
      AI_MODEL: demo-support-v1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - flyyy-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (optional - for full stack development)
  # frontend:
  #   image: node:18-alpine
  #   container_name: flyyy-frontend
  #   working_dir: /app
  #   environment:
  #     VITE_API_URL: http://localhost:8000
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend/project:/app
  #   networks:
  #     - flyyy-network
  #   command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:

networks:
  flyyy-network:
    driver: bridge
